services:
  activity-web-dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: activity-web-dev-docker:latest
    container_name: activity-web-dev-docker
    user: "0:0"
    ports:
      - "8081:8080"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
    volumes:
      - ./cache:/app/cache
      - ./auth.json:/app/auth.json
    restart: unless-stopped
