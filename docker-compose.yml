services:
  activity-web-dev-full:
    build:
      context: .
      dockerfile: Dockerfile
    image: activity-web-dev-docker-full:latest
    container_name: activity-web-dev-docker-full
    user: "0:0"
    ports:
      - "8081:8080"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      FFDEC_BIN: /app/tools/ffdec_full/ffdec.sh
      JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
    volumes:
      - ./cache:/app/cache
      - ./auth.json:/app/auth.json
    restart: unless-stopped
